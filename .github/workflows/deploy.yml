name: Deploy Sello

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check deploy secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="VPS_HOST "
          [ -z "${{ secrets.VPS_USERNAME }}" ] && missing="${missing}VPS_USERNAME "
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="${missing}VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets: $missing. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secrets present (VPS_HOST, VPS_USERNAME, VPS_SSH_KEY)."

      - name: Check VPS reachable on port 22
        run: |
          if ! timeout 20 bash -c "echo >/dev/tcp/${{ secrets.VPS_HOST }}/22" 2>/dev/null; then
            echo "::error::Cannot reach VPS on port 22. Allow inbound TCP 22 from GitHub IPs (https://api.github.com/meta, key: actions). Ensure VPS is up and VPS_HOST is the public IP/hostname."
            exit 1
          fi
          echo "VPS port 22 reachable."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          debug: true
          script: |
            set -e
            trap 'status=$?; if [ $status -eq 0 ]; then echo "✅ SSH session closed after successful deploy"; else echo "❌ Deploy failed (exit $status)"; fi' EXIT

            echo "📦 Loading NVM..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "🟢 Switching to Node 22..."
            nvm use 22 || nvm install 22

            echo "📂 Moving to project directory..."
            cd /var/www/sello

            echo "⬇️ Syncing with GitHub (Main Branch)..."
            git fetch origin
            git reset --hard origin/main

            echo "🧹 Cleaning old build and untracked files..."
            git clean -fd -e .env -e uploads -e client/node_modules -e server/node_modules -e client/dist

            echo "🛠️ Installing Server Dependencies..."
            cd server
            npm install --omit=dev

            echo "🌱 Running Database Sync Scripts..."
            node scripts/initializeVehicleCategories.js || echo "⚠️ Category init skipped"
            node scripts/seedDynamicVehicleAttributes.js || echo "⚠️ Attribute seed skipped"

            echo "🛠️ Building Client Application..."
            cd ../client
            npm install
            npm run build

            if [ -d "build" ]; then
              rm -rf dist
              mv build dist
            fi

            echo "🔄 Restarting Backend with PM2..."
            cd ../server
            pm2 restart sello-server || pm2 start server.js --name sello-server
            pm2 save

            echo "♻️ Reloading Nginx Configuration..."
            sudo systemctl reload nginx

            echo "✅ Deployment Successful!"