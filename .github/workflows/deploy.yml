name: Deploy Sello

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_SUPPORT_EMAIL: ${{ secrets.VITE_SUPPORT_EMAIL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_TINY_API_KEY: ${{ secrets.VITE_TINY_API_KEY }}

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 30m
          debug: true
          envs: VITE_API_URL,VITE_FRONTEND_URL,VITE_SITE_URL,VITE_SUPPORT_EMAIL,VITE_GOOGLE_CLIENT_ID,VITE_TINY_API_KEY
          script: |
            set -e
            trap 'status=$?; if [ $status -eq 0 ]; then echo "✅ SSH session closed after successful deploy"; else echo "❌ Deploy failed (exit $status)"; fi' EXIT

            echo "📦 Loading NVM..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "🟢 Switching to Node 22..."
            nvm use 22 || nvm install 22

            echo "📂 Moving to project directory..."
            cd /var/www/sello

            echo "⬇️ Syncing with GitHub (Main Branch)..."
            git fetch origin
            git reset --hard origin/main

            echo "🧹 Cleaning old build and untracked files..."
            git clean -fd -e .env -e uploads -e client/node_modules -e server/node_modules -e client/dist

            echo "🛠️ Installing Server Dependencies..."
            cd server
            npm ci --omit=dev

            echo "🌱 Running Database Sync Scripts..."
            node scripts/initializeVehicleCategories.js || echo "⚠️ Category init skipped"
            node scripts/seedDynamicVehicleAttributes.js || echo "⚠️ Attribute seed skipped"

            echo "🛠️ Building Client Application..."
            cd ../client
            if [ -z "$VITE_API_URL" ]; then
              echo "❌ Missing VITE_API_URL secret. Aborting deploy."
              exit 1
            fi
            {
              echo "VITE_API_URL=$VITE_API_URL"
              echo "VITE_FRONTEND_URL=$VITE_FRONTEND_URL"
              echo "VITE_SITE_URL=$VITE_SITE_URL"
              echo "VITE_SUPPORT_EMAIL=$VITE_SUPPORT_EMAIL"
              echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
              echo "VITE_TINY_API_KEY=$VITE_TINY_API_KEY"
            } > .env.production
            npm ci
            npm run build

            if [ -d "build" ]; then
              rm -rf dist
              mv build dist
            fi

            echo "🔄 Restarting Backend with PM2..."
            cd ../server
            pm2 restart sello-server || pm2 start server.js --name sello-server
            pm2 save

            echo "♻️ Reloading Nginx Configuration..."
            sudo systemctl reload nginx

            echo "✅ Deployment Successful!"