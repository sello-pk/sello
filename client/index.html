<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / PWA -->
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: API + Meta CAPI gateway early; Facebook only dns-prefetch until deferred pixel loads -->
    <link rel="preconnect" href="https://api.sello.pk" crossorigin />
    <link rel="preconnect" href="https://capig.stape.vip" crossorigin />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- LCP: stable URLs (copied to /lcp/ at build). Preloads are injected at
         runtime for the homepage only (src/main.jsx) so blog article pages do
         not fetch the hero image. -->

    <!-- Critical shell CSS before Tailwind bundle — reduces mobile CLS/LCP snap -->
    <style>
      #root {
        min-height: 100vh;
      }

      .sello-hero-shell {
        position: relative;
        min-height: 48vh;
        width: 100%;
        overflow: hidden;
        background: #0f172a;
        contain: layout style;
      }

      .sello-site-nav {
        min-height: 52px;
        contain: layout style;
      }

      @media (min-width: 640px) {
        .sello-site-nav {
          min-height: 56px;
        }
      }

      .sello-bottom-bar {
        box-sizing: border-box;
        min-height: 52px;
        height: 52px;
        max-height: 52px;
        background: #050b20;
        contain: layout style;
      }

      @media (min-width: 768px) {
        .sello-bottom-bar {
          min-height: 56px;
          height: 56px;
          max-height: 56px;
        }
      }

      .sello-auth-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 44px;
        min-width: 44px;
      }

      @media (min-width: 640px) {
        .sello-auth-slot {
          min-width: 112px;
        }
      }
    </style>

    <!-- SEO -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="author" content="Sello" />
    <meta name="publisher" content="Sello" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Sello helps you buy and sell cars in Pakistan with verified listings, smart filters, and trusted dealers."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sello" />
    <meta property="og:title" content="Sello - Buy and Sell Cars in Pakistan" />
    <meta
      property="og:description"
      content="Discover verified car listings, compare options, and sell your car confidently on Sello."
    />
    <meta property="og:url" content="https://sello.pk/" />
    <meta property="og:image" content="https://sello.pk/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sello - Buy and Sell Cars in Pakistan"
    />
    <meta
      name="twitter:description"
      content="Discover verified car listings, compare options, and sell your car confidently on Sello."
    />
    <meta name="twitter:image" content="https://sello.pk/logo.png" />
    <meta name="msvalidate.01" content="22F35109D5706F037DFCCC8692C1450F" />

    <!-- Google AdSense: account verification + loader (Google asks for the
         code inside <head>). The publisher id is public and hardcoded on
         purpose: a build without client/.env (it is gitignored) used to ship
         "client=%VITE_ADSENSE_CLIENT%", which made every ad request fail.
         Ad units are pushed by src/components/ads/AdSenseSlot.jsx. -->
    <meta name="google-adsense-account" content="ca-pub-5923513384592431" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5923513384592431"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Collapse ad blocks Google could not fill (no empty boxes / labels). */
      ins.adsbygoogle[data-ad-status="unfilled"] {
        display: none !important;
      }
      aside[data-ad-slot-name]:has(ins.adsbygoogle[data-ad-status="unfilled"]) {
        display: none !important;
      }
    </style>

    <!-- Third-party stubs — queue events before deferred scripts load -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-81SP569LXT");
    </script>
    <!-- End third-party stubs -->

    <!-- Site-wide JSON-LD: Organization + WebSite only. Page-level schema
         (listings, cars, blog, FAQ, auctions) is emitted per route by
         src/components/common/StructuredData.jsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://sello.pk/#organization",
            "name": "Sello",
            "url": "https://sello.pk/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://sello.pk/logo.png"
            },
            "slogan": "Pakistan's Smart Car Marketplace",
            "description": "Sello is Pakistan's smart marketplace for buying and selling cars with AI-powered price estimation, live auctions, and free inspection services.",
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+923122221474",
              "contactType": "customer support",
              "areaServed": "PK",
              "availableLanguage": ["English", "Urdu"]
            },
            "sameAs": [
              "https://www.instagram.com/sello.pakistan",
              "https://youtube.com/@sello.pakistan",
              "https://www.facebook.com/share/1DRC6dbkdQ/",
              "https://x.com/sellopak",
              "https://www.tiktok.com/@sello.pakistan"
            ],
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "PK",
              "addressLocality": "Okara",
              "postalCode": "56300",
              "streetAddress": "Gateway Mall"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://sello.pk/#website",
            "name": "Sello",
            "url": "https://sello.pk/",
            "publisher": { "@id": "https://sello.pk/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://sello.pk/search-results?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Title -->
    <title>Sello - Buy and Sell Cars in Pakistan</title>
  </head>

  <body>

    <noscript>
      <img

    </noscript>

    <noscript
      ><iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KPGZZ337"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe

    <!-- End Google Tag Manager (noscript) -->

      <nav>
        <a href="/">Home</a>
        <a href="/cars">Browse Cars</a>
        <a href="/listings">All Listings</a>
        <a href="/listings/cars">Cars</a>
        <a href="/listings/bikes">Bikes</a>
        <a href="/listings/trucks">Trucks</a>
        <a href="/listings/vans">Vans</a>
        <a href="/view-all-brands">All Brands</a>
        <a href="/car-estimator">Car Estimator</a>
        <a href="/auctions">Auctions</a>
        <a href="/auctions/live">Live Auction</a>
        <a href="/blog">Blog</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/help-center">Help Center</a>
        <a href="/help/faqs">FAQs</a>
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms-condition">Terms</a>
      </nav>
    </noscript>

    <!-- React Root -->
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.jsx"></script>
