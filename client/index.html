<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / PWA -->
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: API + Meta CAPI gateway; Facebook only dns-prefetch until deferred pixel loads -->
    <link rel="preconnect" href="https://api.sello.pk" crossorigin />
    <link rel="dns-prefetch" href="https://capig.stape.vip" />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="ard" href="/.well-known/ard.json" type="application/json" />

    <!-- LCP: stable URLs (copied to /lcp/ at build). Preloads are injected at
         runtime for the homepage only (src/main.jsx) so blog article pages do
         not fetch the hero image. -->

    <!-- Critical shell CSS before Tailwind bundle — reduces mobile CLS/LCP snap -->
    <style>
      #root {
        min-height: 100vh;
      }

      .sello-hero-shell {
        position: relative;
        min-height: 48vh;
        width: 100%;
        overflow: hidden;
        background: #0f172a;
        contain: layout style;
      }

      .sello-site-nav {
        min-height: 52px;
        contain: layout style;
      }

      @media (min-width: 640px) {
        .sello-site-nav {
          min-height: 56px;
        }
      }

      .sello-bottom-bar {
        box-sizing: border-box;
        min-height: 52px;
        height: 52px;
        max-height: 52px;
        background: #050b20;
        contain: layout style;
      }

      @media (min-width: 768px) {
        .sello-bottom-bar {
          min-height: 56px;
          height: 56px;
          max-height: 56px;
        }
      }

      .sello-auth-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 44px;
        min-width: 44px;
      }

      @media (min-width: 640px) {
        .sello-auth-slot {
          min-width: 112px;
        }
      }
    </style>

    <!-- SEO -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#3B82F6" />
    <meta name="author" content="Sello" />
    <meta name="publisher" content="Sello" />
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Sello helps you buy and sell cars in Pakistan with verified listings, smart filters, and trusted dealers."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sello" />
    <meta property="og:title" content="Sello - Buy and Sell Cars in Pakistan" />
    <meta
      property="og:description"
      content="Discover verified car listings, compare options, and sell your car confidently on Sello."
    />
    <meta property="og:url" content="https://sello.pk/" />
    <meta property="og:image" content="https://sello.pk/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sello - Buy and Sell Cars in Pakistan"
    />
    <meta
      name="twitter:description"
      content="Discover verified car listings, compare options, and sell your car confidently on Sello."
    />
    <meta name="twitter:image" content="https://sello.pk/logo.png" />
    <meta name="msvalidate.01" content="22F35109D5706F037DFCCC8692C1450F" />

    <!-- Google AdSense: account verification + official loader in <head> -->
    <meta name="google-adsense-account" content="ca-pub-9074113020959790" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9074113020959790"
      crossorigin="anonymous"
    ></script>
    <style>
      /* Collapse ad blocks Google could not fill (no empty boxes / labels). */
      ins.adsbygoogle[data-ad-status="unfilled"] {
        display: none !important;
      }
      aside[data-ad-slot-name]:has(ins.adsbygoogle[data-ad-status="unfilled"]) {
        display: none !important;
      }
    </style>

    <!-- Analytics/ads tags (GA, GTM, Meta, TikTok, Clarity, ContentSquare)
         load only after cookie consent - see PrivacyNotice + loadMarketingScripts.
         dataLayer stub kept so early events can queue if needed. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
    </script>

    <!-- Site-wide JSON-LD fallback for non-home routes / no-JS crawlers.
         Home replaces this with HomePageSchema (AutomotiveBusiness graph).
         Keep @ids aligned with StructuredData.jsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["AutomotiveBusiness", "AutoDealer"],
            "@id": "https://sello.pk/#organization",
            "name": "Sello.pk",
            "legalName": "Sello Group",
            "url": "https://sello.pk",
            "logo": {
              "@type": "ImageObject",
              "@id": "https://sello.pk/#logo",
              "url": "https://sello.pk/logo.png",
              "caption": "Sello.pk Logo"
            },
            "image": { "@id": "https://sello.pk/#logo" },
            "description": "Find the best car for sale in Pakistan on Sello.pk. Buy or sell used cars in Karachi, Lahore, Islamabad & beyond with verified sellers and fair pricing.",
            "email": "info@sello.pk",
            "priceRange": "PKR",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Sello Head Office, Paradise Business Complex Okara Bypass",
              "addressLocality": "Okara",
              "addressRegion": "Punjab",
              "addressCountry": "PK"
            },
            "areaServed": {
              "@type": "Country",
              "name": "Pakistan"
            },
            "sameAs": [
              "https://www.facebook.com/profile.php?id=61584930269294",
              "https://www.instagram.com/sello.pakistan",
              "https://x.com/sellopak",
              "https://www.youtube.com/@sello.pakistan",
              "https://www.tiktok.com/@sello.pakistan"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://sello.pk/#website",
            "url": "https://sello.pk",
            "name": "Car for Sale in Pakistan | Buy & Sell Used Cars – Sello.pk",
            "description": "Find the best car for sale in Pakistan on Sello.pk. Buy or sell used cars in Karachi, Lahore, Islamabad & beyond with verified sellers and fair pricing.",
            "publisher": { "@id": "https://sello.pk/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://sello.pk/listings/car?search={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            },
            "inLanguage": "en-PK"
          }
        ]
      }
    </script>

    <!-- Title -->
    <title>Sello - Buy and Sell Cars in Pakistan</title>
  </head>

  <body>
    <!-- Meta / GTM noscript pixels removed: marketing tags load only after
         cookie consent (cannot honor consent with always-on noscript beacons). -->

    <!-- Noscript navigation for search engine crawlers (no-JS fallback) -->
    <noscript>
      <nav>
        <a href="/">Home</a>
        <a href="/cars">Browse Cars</a>
        <a href="/listings">All Listings</a>
        <a href="/listings/cars">Cars</a>
        <a href="/listings/bikes">Bikes</a>
        <a href="/listings/trucks">Trucks</a>
        <a href="/listings/vans">Vans</a>
        <a href="/view-all-brands">All Brands</a>
        <a href="/search-results?make=Toyota">Toyota</a>
        <a href="/search-results?make=Honda">Honda</a>
        <a href="/search-results?make=Suzuki">Suzuki</a>
        <a href="/search-results?make=Toyota&amp;model=Corolla">Toyota Corolla</a>
        <a href="/search-results?make=Honda&amp;model=Civic">Honda Civic</a>
        <a href="/used-cars/karachi">Used cars in Karachi</a>
        <a href="/used-cars/lahore">Used cars in Lahore</a>
        <a href="/used-cars/islamabad">Used cars in Islamabad</a>
        <a href="/used-cars/rawalpindi">Used cars in Rawalpindi</a>
        <a href="/used-cars/faisalabad">Used cars in Faisalabad</a>
        <a href="/car-estimator">Car Estimator</a>
        <a href="/auctions">Auctions</a>
        <a href="/auctions/live">Live Auction</a>
        <a href="/auctions/schedule">Auction Schedule</a>
        <a href="/blog">Blog</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
        <a href="/help-center">Help Center</a>
        <a href="/help/faqs">FAQs</a>
        <a href="/privacy-policy">Privacy Policy</a>
        <a href="/terms-condition">Terms</a>
      </nav>
    </noscript>

    <!-- React Root -->
    <div id="root"></div>

    <!-- React Entry -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Marketing pixels: loaded after cookie consent (loadMarketingScripts.js) -->

  </body>
</html>
