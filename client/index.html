<!doctype html>

    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / PWA -->
    <link rel="icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance: API + Meta CAPI gateway early; Facebook only dns-prefetch until deferred pixel loads -->
    <link rel="preconnect" href="https://api.sello.pk" crossorigin />
    <link rel="preconnect" href="https://capig.stape.vip" crossorigin />
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- LCP: stable URLs (copied to /lcp/ at build) — discoverable before JS bundle -->
    <link
      rel="preload"
      as="image"
      href="/lcp/heroMobile.webp"
      fetchpriority="high"
      media="(max-width: 767px)"
    />
    <link
      rel="preload"
      as="image"
      href="/lcp/hero.webp"
      fetchpriority="high"
      media="(min-width: 768px)"
    />

    <!-- Critical shell CSS before Tailwind bundle — reduces mobile CLS/LCP snap -->
    <style>
      #root {
        min-height: 100vh;
      }

      .sello-hero-shell {
        position: relative;
        min-height: 48vh;
        width: 100%;
        overflow: hidden;
        background: #0f172a;
        contain: layout style;
      }

      .sello-site-nav {
        min-height: 52px;
        contain: layout style;
      }

      @media (min-width: 640px) {
        .sello-site-nav {
          min-height: 56px;
        }
      }

      .sello-bottom-bar {
        box-sizing: border-box;
        min-height: 52px;
        height: 52px;
        max-height: 52px;
        background: #050b20;
        contain: layout style;
      }

      @media (min-width: 768px) {
        .sello-bottom-bar {
          min-height: 56px;
          height: 56px;
          max-height: 56px;
        }
      }

      .sello-auth-slot {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        min-height: 44px;
        min-width: 44px;
      }

      @media (min-width: 640px) {
        .sello-auth-slot {
          min-width: 112px;
        }
      }
    </style>
